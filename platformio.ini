; Bun_Server - ESP32 self-hosted web panel
;
; Platform is pinned to 6.2.0 (Arduino core 2.0.12 / ESP-IDF 4.4.4).
; Library versions are pinned EXACTLY (not caret ranges) because
; ESPAsyncWebServer 4.x drops Arduino 2.x support - a silent minor bump
; would break the build. Upgrade deliberately, never automatically.

[env:esp32dev]
platform = espressif32@6.2.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; LittleFS over SPIFFS: SPIFFS burns ~2KB stack per file op and fragments
; the heap, which is the usual cause of "runs for hours then crashes".
board_build.filesystem = littlefs
board_build.partitions = partitions_bun.csv

lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3

build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    ; Trim ArduinoJson std:: support we never use - saves flash and RAM.
    -DARDUINOJSON_ENABLE_STD_STRING=0
    -DARDUINOJSON_ENABLE_STD_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
    -DASYNCWEBSERVER_USE_CHUNK_INFLIGHT=0

; Builds web/ (Vite + React) into data/ before the firmware build.
; Cached on a content hash; safe to leave in place.
extra_scripts = pre:scripts/build_web.py
